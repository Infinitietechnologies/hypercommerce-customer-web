name: Deploy Dev to aaPanel

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional: Build in GitHub Actions first
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build
          git reset --hard HEAD
          git clean -fd 
        env:
          # Add any build-time env vars here
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Trigger aaPanel Webhook
        uses: tunnaduong/aapanel-deploy-action@main
        with:
          panel_url: ${{ secrets.AAPANEL_URL }}
          webhook_key: ${{ secrets.AAPANEL_WEBHOOK_KEY }}